    button {

      height: 48px;
      background: #3FE0C5;
      color: #0B0C0E;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.05s;

    button:hover {
      background: #35c4ac;
    }
    button:active {
      transform: scale(0.98);
    }
    .err {
      color: #FF6B4A;
      font-size: 13px;
      font-weight: 500;
      margin-top: 14px;
      display: none;

      opacity: 0.7;
      pointer-events: none;

      color: #9AA0A6;
      font-size: 14px;
      padding: 20px 0;

        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);

          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );

        const salt = b64ToBuf(payload.salt);
        const key = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          passKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const iv = b64ToBuf(payload.iv);
        const data = b64ToBuf(payload.data);
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          data
        );

        return new TextDecoder().decode(decrypted);
      }

      function renderDocument(html) {
        document.open();
        document.write(html);
        document.close();
      }

      async function tryUnlock(password, isAuto) {
        if (!password) return;
        errMsg.style.display = 'none';
        if (isAuto) {
          form.style.display = 'none';
          loadingState.style.display = 'block';
        } else {
          submitBtn.classList.add('loading');
          submitBtn.disabled = true;
        }

        try {
          const html = await decrypt(password);
          try {
            sessionStorage.setItem(STORAGE_KEY, password);
          } catch (e) {}
          renderDocument(html);
        } catch (err) {
          console.error(err);
          if (isAuto) {
            form.style.display = 'block';
            loadingState.style.display = 'none';
            try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
          } else {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
            errMsg.style.display = 'block';
            input.focus();
            input.select();
          }
        }
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        tryUnlock(input.value.trim(), false);
      });

      // Check session storage for auto-unlock
      try {
        const savedPass = sessionStorage.getItem(STORAGE_KEY);
        if (savedPass) {
          tryUnlock(savedPass, true);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
