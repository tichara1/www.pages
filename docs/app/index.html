  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

      min-height: 100dvh;

      align-items: center;
      justify-content: center;
      padding: 20px;

    }
    .card {

      border-radius: 20px;
      padding: 36px 28px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.5);

      font-weight: 700;
      font-size: 34px;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

      color: #3FE0C5;
    }
    .subtitle {
      font-size: 13px;
      color: #9AA0A6;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #1D2024;
      border: 1px solid #2A2E34;
      color: #3FE0C5;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 20px;
    }
    .input-wrap {
      margin-bottom: 12px;
    }
    input {
      width: 100%;
      height: 48px;
      background: #1D2024;
      border: 1px solid #2A2E34;
      border-radius: 12px;
      color: #F2F4F5;
      font-size: 16px;
      padding: 0 16px;
      text-align: center;
      letter-spacing: 0.05em;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    input:focus {
      border-color: #3FE0C5;
      box-shadow: 0 0 0 3px rgba(63, 224, 197, 0.15);
    }
    button {
      width: 100%;
      height: 48px;
      background: #3FE0C5;
      color: #0B0C0E;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background 0.15s, transform 0.05s;
    }
    button:hover {
      background: #35c4ac;
    }
    button:active {
      transform: scale(0.98);
    }
    .err {
      color: #FF6B4A;
      font-size: 13px;
      font-weight: 500;
      margin-top: 14px;
      display: none;
    }
    .loading {
      opacity: 0.7;
      pointer-events: none;
    }
    #loadingState {
      display: none;
      color: #9AA0A6;
      font-size: 14px;
      padding: 20px 0;
    }

  <script>
    (function() {
      const STORAGE_KEY = 'repx_gate_pass';
      const form = document.getElementById('passForm');
      const input = document.getElementById('passInput');
      const submitBtn = document.getElementById('submitBtn');
      const errMsg = document.getElementById('errMsg');
      const loadingState = document.getElementById('loadingState');
      const payloadEl = document.getElementById('payload');
      const payload = JSON.parse(payloadEl.textContent);

      function b64ToBuf(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      async function decrypt(password) {
        const enc = new TextEncoder();
        const passKey = await crypto.subtle.importKey(
          'raw',
          enc.encode(password),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );

        const salt = b64ToBuf(payload.salt);
        const key = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          passKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const iv = b64ToBuf(payload.iv);
        const data = b64ToBuf(payload.data);
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          data
        );

        return new TextDecoder().decode(decrypted);
      }

      function renderDocument(html) {
        document.open();
        document.write(html);
        document.close();
      }

      async function tryUnlock(password, isAuto) {
        if (!password) return;
        errMsg.style.display = 'none';
        if (isAuto) {
          form.style.display = 'none';
          loadingState.style.display = 'block';
        } else {
          submitBtn.classList.add('loading');
          submitBtn.disabled = true;
        }

        try {
          const html = await decrypt(password);
          try {
            sessionStorage.setItem(STORAGE_KEY, password);
          } catch (e) {}
          renderDocument(html);
        } catch (err) {
          console.error(err);
          if (isAuto) {
            form.style.display = 'block';
            loadingState.style.display = 'none';
            try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
          } else {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
            errMsg.style.display = 'block';
            input.focus();
            input.select();
          }
        }
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        tryUnlock(input.value.trim(), false);
      });

      // Check session storage for auto-unlock
      try {
        const savedPass = sessionStorage.getItem(STORAGE_KEY);
        if (savedPass) {
          tryUnlock(savedPass, true);
        }
      } catch (e) {}
    })();
  </script>
