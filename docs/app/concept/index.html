  <script>
    (function() {
      const STORAGE_KEY = 'repx_gate_pass';
      const form = document.getElementById('passForm');
      const input = document.getElementById('passInput');
      const submitBtn = document.getElementById('submitBtn');
      const errMsg = document.getElementById('errMsg');
      const loadingState = document.getElementById('loadingState');
      const payloadEl = document.getElementById('payload');
      const payload = JSON.parse(payloadEl.textContent);

      function b64ToBuf(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
        return bytes;
      }

      async function decrypt(password) {
        const enc = new TextEncoder();
        const passKey = await crypto.subtle.importKey(
          'raw',
          enc.encode(password),
          { name: 'PBKDF2' },
          false,
          ['deriveKey']
        );

        const salt = b64ToBuf(payload.salt);
        const key = await crypto.subtle.deriveKey(
          {
            name: 'PBKDF2',
            salt: salt,
            iterations: 100000,
            hash: 'SHA-256'
          },
          passKey,
          { name: 'AES-GCM', length: 256 },
          false,
          ['decrypt']
        );

        const iv = b64ToBuf(payload.iv);
        const data = b64ToBuf(payload.data);
        const decrypted = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: iv },
          key,
          data
        );

        return new TextDecoder().decode(decrypted);
      }

      function renderDocument(html) {
        document.open();
        document.write(html);
        document.close();
      }

      async function tryUnlock(password, isAuto) {
        if (!password) return;
        errMsg.style.display = 'none';
        if (isAuto) {
          form.style.display = 'none';
          loadingState.style.display = 'block';
        } else {
          submitBtn.classList.add('loading');
          submitBtn.disabled = true;
        }

        try {
          const html = await decrypt(password);
          try {
            sessionStorage.setItem(STORAGE_KEY, password);
          } catch (e) {}
          renderDocument(html);
        } catch (err) {
          console.error(err);
          if (isAuto) {
            form.style.display = 'block';
            loadingState.style.display = 'none';
            try { sessionStorage.removeItem(STORAGE_KEY); } catch (e) {}
          } else {
            submitBtn.classList.remove('loading');
            submitBtn.disabled = false;
            errMsg.style.display = 'block';
            input.focus();
            input.select();
          }
        }
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        tryUnlock(input.value.trim(), false);
      });

      // Check session storage for auto-unlock
      try {
        const savedPass = sessionStorage.getItem(STORAGE_KEY);
        if (savedPass) {
          tryUnlock(savedPass, true);
        }
      } catch (e) {}
    })();
  </script>
</body>
</html>
