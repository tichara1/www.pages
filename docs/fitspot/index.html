<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>FitSpot — přepínač verzí</title>
<meta name="description" content="FitSpot: v1 pronájem prostorů, v2 hledání trenéra podle lokality a cvičení."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: #0B0C08; color: #F1F4E8;
    font-family: 'Archivo', -apple-system, BlinkMacSystemFont, sans-serif;
  }
  header {
    flex: 0 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: #11130C; border-bottom: 1px solid #22261A;
  }
  .brand { display: flex; align-items: center; gap: 9px; }
  .mark {
    width: 26px; height: 26px; border-radius: 7px; background: #C6FF3A; color: #0B0C08;
    display: grid; place-items: center; font-weight: 900; font-size: 15px;
  }
  .name { font-weight: 900; font-size: 16px; letter-spacing: 0.02em; }
  .switch { display: flex; gap: 4px; padding: 3px; background: #191C11; border: 1px solid #22261A; border-radius: 10px; }
  .switch button {
    padding: 6px 18px; border: none; border-radius: 7px; cursor: pointer;
    background: transparent; color: #9AA18A; font: inherit; font-size: 13px; font-weight: 800;
    letter-spacing: 0.04em;
  }
  .switch button:hover { color: #F1F4E8; }
  .switch button[aria-pressed="true"] { background: #C6FF3A; color: #0B0C08; }
  .switch button:focus-visible { outline: 2px solid #C6FF3A; outline-offset: 2px; }
  .caption { flex: 1 1 240px; min-width: 0; font-size: 12.5px; color: #6B7259; }
  iframe { flex: 1 1 auto; width: 100%; border: none; background: #0B0C08; }
</style>
</head>
<body>
<header>
  <div class="brand"><div class="mark">F</div><div class="name">FITSPOT</div></div>
  <div class="switch" role="group" aria-label="Verze prototypu">
    <button type="button" data-v="v1">v1</button>
    <button type="button" data-v="v2">v2</button>
  </div>
  <div class="caption" id="caption"></div>
</header>
<iframe id="frame" title="FitSpot" src="about:blank"></iframe>

<script>
(function () {
  var KEY = 'fitspot.version';
  var VERSIONS = {
    v1: { src: 'v1/index.html', caption: 'v1 — pronájem tělocvičen po hodinách, lekce a přehled pro majitele prostoru.' },
    v2: { src: 'v2/index.html', caption: 'v2 — hledání trenéra podle lokality, cvičení a typu prostoru; požadavek na trénink se zdravotním dotazníkem; super admin s provizemi.' }
  };

  var frame = document.getElementById('frame');
  var caption = document.getElementById('caption');
  var buttons = Array.prototype.slice.call(document.querySelectorAll('.switch button'));

  function stored() {
    try { return localStorage.getItem(KEY); } catch (e) { return null; }
  }

  function resolve() {
    var q = new URLSearchParams(location.search).get('v');
    if (VERSIONS[q]) return q;
    var s = stored();
    if (VERSIONS[s]) return s;
    return 'v2';
  }

  function show(v, pushUrl) {
    if (!VERSIONS[v]) v = 'v2';
    try { localStorage.setItem(KEY, v); } catch (e) { /* private mode */ }
    buttons.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.v === v)); });
    caption.textContent = VERSIONS[v].caption;
    if (frame.getAttribute('src') !== VERSIONS[v].src) frame.setAttribute('src', VERSIONS[v].src);
    if (pushUrl) history.replaceState(null, '', '?v=' + v);
  }

  buttons.forEach(function (b) {
    b.addEventListener('click', function () { show(b.dataset.v, true); });
  });

  show(resolve(), false);
})();
</script>
</body>
</html>
