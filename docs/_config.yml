# Nastavení kompletně přepisuje Jekyll defaulty, ne doplňuje je.
# Sem patří všechno, co je vývojářská dokumentace nebo nástroj — do publikovaného
# webu smí jen to, co je součástí běžící stránky.
exclude:
  - superpowers          # specs & plans
  - date/src/TESTING.md
  - date/src/serve.sh
  - weather/README.md
  - weather/tests
  - weather/package.json
  - fitspot/README.md
  - fitspot/v2/tests
